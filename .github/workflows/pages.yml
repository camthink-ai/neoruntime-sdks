name: Deploy SDK docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "python/docs/**"
      - "python/neoruntime_ipc_sdk/**"
      - "python/setup.py"
      - "cpp/docs/**"
      - "cpp/Doxyfile"
      - "cpp/include/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./python
          python -m pip install -r python/docs/requirements.txt

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build documentation
        run: |
          mkdir -p _site/python
          python -m sphinx -b html python/docs _site/python/zh
          python -m sphinx -b html python/docs/en _site/python/en
          # Landing + language-selector pages: VitePress-styled templates
          # checked in under site/, matching the NE301 docs look.
          cp site/index.html _site/index.html
          cp site/python-index.html _site/python/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
