name: Build SDK release artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "python/**"
      - "proto/**"
      - "scripts/build_sdk_wheel.sh"
      - ".github/workflows/wheel.yml"
      - "!python/docs/**"
      - "!python/**/*.md"
      - "python/README.md"
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create or update a GitHub Release with the built SDK artifacts.
        required: false
        type: boolean
        default: false
      release_tag:
        description: Release tag to publish. Defaults to v<python/setup.py version>.
        required: false
        type: string
      publish_testpypi:
        description: Upload the built Python distributions to TestPyPI via Trusted Publishing.
        required: false
        type: boolean
        default: false
      publish_pypi:
        description: Upload the built Python distributions to PyPI (requires pypi environment approval).
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: python-sdk-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Python SDK scope
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.filter.outputs.python }}

    steps:
      - name: Classify changed files
        id: filter
        uses: actions/github-script@v9
        with:
          script: |
            let pythonNeeded = context.eventName !== 'pull_request';

            if (context.eventName === 'pull_request') {
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                });
                const paths = files.flatMap((file) =>
                  file.previous_filename
                    ? [file.filename, file.previous_filename]
                    : [file.filename],
                );
                pythonNeeded = files.length >= 3000 || paths.some((path) => {
                  if (path === '.github/workflows/wheel.yml') return true;
                  if (path.startsWith('proto/')) return true;
                  if (path === 'scripts/build_sdk_wheel.sh') return true;
                  if (path === 'python/README.md') return true;
                  if (!path.startsWith('python/')) return false;
                  return !(path.endsWith('.md') || path.startsWith('python/docs/'));
                });
              } catch (error) {
                core.warning(`Unable to classify changed files: ${error.message}`);
                pythonNeeded = true;
              }
            }

            core.setOutput('python', pythonNeeded ? 'true' : 'false');
            await core.summary
              .addHeading('Python SDK build scope', 3)
              .addRaw(pythonNeeded ? 'Build and test required.' : 'No Python build required.')
              .write();

  build-wheel:
    needs: changes
    if: always()
    runs-on: ubuntu-24.04
    env:
      SHOULD_BUILD: ${{ needs.changes.result != 'success' || needs.changes.outputs.python == 'true' }}

    steps:
      - name: No Python build required
        if: env.SHOULD_BUILD != 'true'
        run: echo "This change does not affect the Python SDK"

      - name: Checkout
        if: env.SHOULD_BUILD == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: env.SHOULD_BUILD == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: env.SHOULD_BUILD == 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e "./python[dev]"

      - name: Run tests
        if: env.SHOULD_BUILD == 'true'
        run: python -m pytest -q python/tests

      - name: Validate release version
        if: env.SHOULD_BUILD == 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          setup_py = pathlib.Path("python/setup.py").read_text(encoding="utf-8")
          match = re.search(r'version\s*=\s*["\']([^"\']+)["\']', setup_py)
          if not match:
              sys.exit("Could not find version in python/setup.py")

          package_version = match.group(1)

          init_py = pathlib.Path("python/neoruntime_ipc_sdk/__init__.py").read_text(encoding="utf-8")
          init_match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', init_py)
          if not init_match:
              sys.exit("Could not find __version__ in python/neoruntime_ipc_sdk/__init__.py")
          if init_match.group(1) != package_version:
              sys.exit(
                  f"python/neoruntime_ipc_sdk/__init__.py version {init_match.group(1)} "
                  f"does not match python/setup.py version {package_version}"
              )
          release_tag = os.environ.get("RELEASE_TAG", "").strip()
          if not release_tag and os.environ.get("GITHUB_REF_TYPE") == "tag":
              release_tag = os.environ["GITHUB_REF_NAME"]
          if not release_tag:
              release_tag = f"v{package_version}"
          if not release_tag.startswith("v"):
              release_tag = f"v{release_tag}"

          tag_version = release_tag.removeprefix("v")
          if package_version != tag_version:
              sys.exit(
                  f"Release tag version {tag_version} does not match package version {package_version}"
              )
          print(f"Release tag: {release_tag}")
          PY

      - name: Build distributions
        if: env.SHOULD_BUILD == 'true'
        run: |
          rm -rf python/dist
          cd python
          python -m build

      - name: Inspect distributions
        if: env.SHOULD_BUILD == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          dist = Path("python/dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"Expected one wheel and one sdist, found {len(wheels)} wheel(s) and {len(sdists)} sdist(s)"
              )

          with ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
          if any(name.startswith("tests/") for name in names):
              raise SystemExit("Wheel unexpectedly contains tests/")
          if not any(name.startswith("neoruntime_ipc_sdk/proto/") for name in names):
              raise SystemExit("Wheel is missing neoruntime_ipc_sdk/proto/")

          print(wheels[0])
          print(sdists[0])
          PY

      - name: Upload Python distributions
        if: env.SHOULD_BUILD == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: python-sdk-dist
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    needs:
      - build-wheel
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-sdk-dist
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          wheel="$(ls dist/neoruntime_ipc_sdk-*.whl | head -1)"
          sdist="$(ls dist/neoruntime_ipc_sdk-*.tar.gz | head -1)"
          version="$(basename "$wheel" | sed -E 's/^neoruntime_ipc_sdk-([^-]+)-.*/\1/')"

          tag_name="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag_name="$RELEASE_TAG"
            if [ -z "$tag_name" ]; then
              tag_name="v$version"
            fi
          fi
          case "$tag_name" in
            v*) ;;
            *) tag_name="v$tag_name" ;;
          esac

          if [ "${tag_name#v}" != "$version" ]; then
            echo "Release tag $tag_name does not match wheel version $version" >&2
            exit 1
          fi

          if gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag_name" "$wheel" "$sdist" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag_name" "$wheel" "$sdist" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag_name" \
              --notes "SDK release $tag_name: Python distributions (wheel + sdist)."
          fi

  publish-testpypi:
    needs:
      - build-wheel
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_testpypi)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: testpypi

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-sdk-dist
          path: dist

      - name: Verify distributions
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel and one sdist in dist/" >&2
            ls -la dist >&2
            exit 1
          fi
          version="$(basename "${wheels[0]}" | sed -E 's/^neoruntime_ipc_sdk-([^-]+)-.*/\1/')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match wheel version $version" >&2
              exit 1
            fi
          fi
          echo "Publishing neoruntime-ipc-sdk $version to TestPyPI"

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

  publish-pypi:
    needs:
      - build-wheel
      - publish-testpypi
    if: ${{ !cancelled() && !failure() && ((startsWith(github.ref, 'refs/tags/v') && needs.publish-testpypi.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-sdk-dist
          path: dist

      - name: Verify distributions
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel and one sdist in dist/" >&2
            ls -la dist >&2
            exit 1
          fi
          version="$(basename "${wheels[0]}" | sed -E 's/^neoruntime_ipc_sdk-([^-]+)-.*/\1/')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match wheel version $version" >&2
              exit 1
            fi
          fi
          echo "Publishing neoruntime-ipc-sdk $version to PyPI"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          print-hash: true
